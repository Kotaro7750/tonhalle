name: Publish backend container image

on:
  push:
    tags:
      - "backend-v*"

permissions:
  contents: read

jobs:
  prepare:
    name: Determine image version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.image.outputs.version }}

    steps:
      - name: Determine image version
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^backend-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unsupported backend tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          echo "version=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }} image
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:backend"
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/tonhalle-backend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.artifact }}

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: backend-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs:
      - prepare
      - build
    runs-on: ubuntu-26.04

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: backend-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and inspect multi-platform image
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tonhalle-backend
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          images=()
          for digest in *; do
            images+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${images[@]}" --tag "${IMAGE_NAME}:${IMAGE_VERSION}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_VERSION}"
