[package]
name = "tonhalle-backend"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
aliri = "0.6.4"
aliri_clock = "0.1.4"
aliri_oauth2 = { version = "0.10.2", default-features = false, features = ["reqwest", "rsa", "rustls-tls", "tokio"] }
aliri_tower = "0.6.1"
anyhow = "1"
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
rsa = { version = "0.9", features = ["sha1"] }
sha1 = "0.10"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
getset = "0.1"
hex = "0.4"
itertools = "0.15"
lofty = "0.25"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tonhalle_api = { path = "openapi_generated", default-features = false }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tempfile = "3"

[dev-dependencies]
aws-smithy-mocks = "0.3"
aws-sdk-s3 = { version = "1", features = ["test-util"] }
jsonschema = { version = "0.58", default-features = false }
serde_yaml_ng = "0.10"
tower = { version = "0.5", features = ["util"] }
